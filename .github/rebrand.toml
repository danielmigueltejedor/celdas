# What `scripts/rebrand.py` renames: upstream's GridCraft becomes Celdas, in file contents and in
# paths. The weekly upstream sync applies the same rules to upstream's tree before merging it, so
# a rule added here applies to everything upstream sends from then on.
#
# Replacements are literal and case-sensitive, applied in order: put the longer, more specific
# ones first. Keep spans are found before any replacement, so a replacement never reaches inside
# one.

# Left as they are wherever they appear (in file contents and in paths).
keep = [
    # Links to upstream's issues, pull requests and commits, and to other people's repositories:
    # history, not branding. Links to upstream's tree and repository page are renamed below.
    "(https?://)?github\\.com/storytold/[\\w.-]+/(issues|pull|commit|discussions)/[^\\s)\\]\"'<>`]*",
    "https?://(github\\.com|raw\\.githubusercontent\\.com)/(?!storytold/(gridcraft|craft-fonts|craft-i18n|craft-libs|egui|winit)\\b|getnodalia|danielmigueltejedor)[^\\s)\\]\"'<>`]*",
    # A Cargo [patch] names the source it overrides, which other crates still point at.
    "\\[patch\\.\"https://github\\.com/storytold/[^\"]+\"\\]",
    # Upstream's issues named without a link (`storytold/gridcraft#123`).
    "storytold/[\\w.-]+#\\d+",
    # Upstream's repository in the sync workflow and in the record of what came from it.
    "(?<=UPSTREAM_REPO: )storytold/gridcraft",
    # Credit for work done upstream.
    "GridCraft contributors",
    "ArtCraft Team",
]

# Files left alone entirely.
skip = [
    ".github/rebrand.toml",
    "scripts/rebrand.py",
    # Licence notices keep upstream's copyright line, which the licences require.
    "NOTICE",
    "LICENSE-*",
    "licenses/*",
    # The record of what came from upstream, and upstream's own README kept for reference.
    "docs/upstream.md",
    "NODALIA_MIGRATION.md",
    "docs/upstream-readme.md",
    # Binary Finder layout of the disk image: rebuilt by its own script.
    "*.DS_Store",
]

# Run after renaming: shorter names change how rustfmt wraps lines and sorts imports.
after = [["cargo", "fmt", "--all"]]

# Lines that keep this app's value when upstream's tree is rebranded (the sync passes --pin-from).
[[pin]]
file = "Cargo.toml"
pattern = '^version = "[^"]*"'

# Identity: app id, publisher, installer identities (a product of its own, never GridCraft's).
[[replace]]
from = "ai.storyteller.gridcraft"
to = "dev.danielmiguelt.Celdas"

[[replace]]
from = "GridCraft maintainers <gridcraft@storyteller.ai>"
to = "Nodalia <https://github.com/getnodalia/celdas/issues>"

[[replace]]
from = "<developer id=\"ai.storyteller\">"
to = "<developer id=\"dev.danielmiguelt\">"

[[replace]]
from = "Learning Machines LLC"
to = "Nodalia"

[[replace]]
from = "5511327B-F305-41BE-92D0-EB84944E7C4D"
to = "8E3C1A47-52D9-4B6F-A0E8-3F7B2C9D1E64"

